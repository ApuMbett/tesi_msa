[project]
name = "semantic-msa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "scikit-learn>=1.0",
    "demucs>=4.0.0",
    "matplotlib>=3.7.0",
    "torch>=2.3.1",
    "transformers>=4.42.3",
    "timm>=1.0.7",
    "pytorch-lightning>=2.3.2",
    "scipy>=1.14.0",
    "pandas>=2.2.2",
    "pillow>=10.4.0",
    "datasets>=2.20.0",
    "whisperx @ git+https://github.com/m-bain/whisperx.git@2cfd7b7c5c7bba144954364db747319b50e8232b",
]

[tool.uv]
environments = [
    "sys_platform == 'linux'",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_msa"]

[project.scripts]
analyze-track = "semantic_msa.main:main"
