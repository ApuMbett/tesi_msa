[project]
name = "semantic-msa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "pydantic>=2.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "scikit-learn>=1.0",
    "demucs>=4.0.0",
    "matplotlib>=3.7.0",
    "torch>=2.3.1",
    "transformers>=4.42.3",
    "timm>=1.0.7",
    "pytorch-lightning>=2.3.2",
    "scipy>=1.14.0",
    "pandas>=2.2.2",
    "pillow>=10.4.0",
    "datasets>=2.20.0",
    # NOTE: whisperx is explicitly excluded from these dependencies because its 
    # upstream requirements.txt secretly injects conflicting PyTorch index URLs 
    # (--extra-index-url cu128). This causes strict package managers like 'uv' 
    # to panic and crash during dependency resolution. 
    # You MUST install it manually using: 
    # uv pip install git+https://github.com/m-bain/whisperx.git@2cfd7b7c5c7bba144954364db747319b50e8232b
    # and run the project using `uv run --no-sync` to avoid wiping it.
    "rich>=15.0.0",
]

[tool.uv]
environments = [
    "sys_platform == 'linux'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_msa"]

[project.scripts]
analyze-track = "semantic_msa.main:main"
