# ==============================================================================
# SEMANTIC MSA MULTI-AGENT PIPELINE CONFIGURATION
# ==============================================================================

# Benchmark / Experiment identification tag
experiment_name: "default_pipeline"

# Time unit for all output timestamps and boundaries: "minutes" (MM:SS) or "seconds" (SS.SS)
unit: "minutes"

# ------------------------------------------------------------------------------
# PIPELINE EXECUTION SETTINGS (Crucial for 50+ Track Benchmarks)
# ------------------------------------------------------------------------------
pipeline_settings:
  # Checkpoint resumption: If true, checks data/processed/<track>/agents/<step>.json
  # and skips LLM execution if a valid output already exists.
  resume: true

  # Intermediate artifact persistence: If true, saves profiler.json, researcher.json,
  # captioner.json, and segmenter.json. If false, only final.json is saved.
  save_intermediate_steps: true

  # Resilience: Number of retries with exponential backoff on transient API errors
  # (e.g., HTTP 429 rate limit, 503 unavailable) or malformed JSON responses.
  max_retries: 2

# ------------------------------------------------------------------------------
# DOMAIN AGENT CONFIGURATIONS
# ------------------------------------------------------------------------------
# Common parameters for all agents:
#   model: Model ID (e.g. "gemini-3.8-flash", "gemini-3.1-pro-preview", "gemini-2.5-flash", "gemini-2.5-pro")
#   temperature: Float [0.0 - 2.0]. Low (0.1 - 0.3) for strict JSON / deterministic tasks, higher (0.6 - 0.7) for synthesis
#   grounding: Boolean. When true, enables native Google Search grounding tool (typically for researcher)
#   explainable: Boolean. When true, loads <agent>_explainable.txt prompt and produces chain-of-thought rationale fields
#   thinking_level: String. Gemini reasoning effort: "minimal", "low", "medium", "high" (supported on gemini-2.5 / 3.x)
#   thinking_budget: Integer. Optional explicit token budget for thinking (e.g. 1024, 2048). 0 or -1 to disable.
#
# Agent-specific parameters:
#   captioner:
#     caption_length: Integer. Target word count per token caption (default: 12)
#   segmenter:
#     granularity: String. Segmentation resolution: "COARSE" (macro sections), "MEDIUM" (standard), "FINE" (micro phrases)
# ------------------------------------------------------------------------------
agents:
  profiler:
    model: "gemini-3.8-flash"
    temperature: 0.2
    grounding: false
    explainable: true
    thinking_level: "low"

  researcher:
    model: "gemini-3.8-flash"
    temperature: 0.2
    grounding: true
    explainable: true
    thinking_level: "low"

  captioner:
    model: "gemini-3.8-flash"
    temperature: 0.6
    grounding: false
    caption_length: 12
    explainable: true
    thinking_level: "low"

  segmenter:
    model: "gemini-3.1-pro-preview"
    temperature: 0.7
    grounding: false
    granularity: "MEDIUM"
    explainable: true
    thinking_level: "high"
