[project]
name = "beatnet-engine"
version = "0.1.0"
description = "Isolated environment for BeatNet and ancient dependencies"
readme = "README.md"
requires-python = ">=3.9,<3.10"
dependencies = [
    "beatnet>=1.1.3",
    "numpy<1.22.0",
    "setuptools<70.0.0",
    "pyaudio>=0.2.14",
]

[tool.uv.extra-build-dependencies]
madmom = ["Cython", "numpy<1.22.0"]
